version: v2
inputs:
  - directory: proto
plugins:
  - local: apps/web/node_modules/.bin/protoc-gen-es
    out: apps/web/src/gen
    opt: target=ts
  - remote: buf.build/protocolbuffers/python:v36.2
    out: apps/sim/src
  - remote: buf.build/protocolbuffers/pyi:v36.2
    out: apps/sim/src
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: tools/loadgen/gen
    opt:
      - paths=source_relative
      - Mnoahos/sim/v1/sim.proto=noahos/loadgen/gen/noahos/sim/v1;simv1
  - remote: buf.build/apple/swift:v1.39.0
    out: apps/vision/Sources/Gen
    opt: Visibility=Internal
