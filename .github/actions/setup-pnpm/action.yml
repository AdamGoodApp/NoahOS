name: Set up pnpm
description: Install pnpm and Node, then the workspace dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
