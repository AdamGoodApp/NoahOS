[project]
name = "noahos-sim"
version = "0.1.0"
description = "NoahOS live simulation orchestrator: MuJoCo sessions streaming Protobuf telemetry and WebRTC cameras"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mujoco>=3.17,<4",
  "numpy>=2.2",
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "websockets>=15",
  "httpx>=0.28",
  "protobuf>=7.36.2,<8",
  "pydantic>=2.11",
  "pydantic-settings>=2.16",
  "pyyaml>=6",
  "psutil>=7",
  "pillow>=11",
  "aiortc>=1.15",
  "av>=14",
  "foxglove-sdk>=0.30,<0.31",
  "onnxruntime>=1.20",
]

[project.scripts]
noahos-sim = "noahos_sim.cli:main"

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "ruff>=0.17"]
usd = ["usd-core>=26.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noahos_sim", "src/noahos"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/noahos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
